AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Leave Management API with Step Functions and TypeScript

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 28
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps

Parameters:
  LeaveRequestsTableNameParam:
    Type: String
    Description: Name of the DynamoDB table for leave requests.
    Default: LeaveRequestsTableProd

  ExternalDependencies:
    Type: String
    Description: Space-separated list of dependencies to mark as external during esbuild bundling
    Default: "@aws-sdk/*"

Resources:

  LeaveManagementApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      DefinitionUri: swagger.yaml

  LeaveRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LeaveRequestsTableNameParam
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH

  CustomAuthorizerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-CustomAuthorizerLambda"
      CodeUri: .
      Handler: src/functions/custom-authorizer/app.handler
      Policies: []
      Environment:
        Variables:
          JWT_SECRET: your-super-secret-jwt-key
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External: !Split [" ", !Ref ExternalDependencies]
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/custom-authorizer/app.ts

  ApplyLeaveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ApplyLeaveFunction"
      CodeUri: .
      Handler: src/functions/apply-leave/app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaveRequestsTable
        - Statement:
            Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"
      Environment:
        Variables:
          LEAVE_REQUESTS_TABLE_NAME: !Ref LeaveRequestsTable
          STEP_FUNCTION_ARN: !Ref LeaveApprovalStateMachine
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External: !Split [" ", !Ref ExternalDependencies]
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/apply-leave/app.ts

  ProcessApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ProcessApprovalFunction"
      CodeUri: .
      Handler: src/functions/process-approval/app.handler
      Role: !GetAtt ProcessApprovalFunctionRole.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaveRequestsTable
        - Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"

            Effect: Allow
            Action:
              - states:SendTaskSuccess
              - states:SendTaskFailure
              - states:SendTaskHeartbeat
            Resource: !GetAtt LeaveApprovalStateMachine.Arn
      Environment:
        Variables:
          LEAVE_REQUESTS_TABLE_NAME: !Ref LeaveRequestsTable

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External: !Split [" ", !Ref ExternalDependencies]
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/process-approval/app.ts
  
  ProcessApprovalFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ProcessApprovalFunctionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FullProcessApprovalPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                  - states:SendTaskHeartbeat
                Resource: !GetAtt LeaveApprovalStateMachine.Arn

              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt LeaveRequestsTable.Arn

              - Effect: Allow
                Action:
                  - cloudwatch:*
                Resource: "*"

              - Effect: Allow
                Action:
                  - states:DescribeExecution
                Resource: "*"

              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"

  SendNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-SendNotificationFunction"
      CodeUri: .
      Handler: src/functions/send-notification/app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaveRequestsTable
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: '*'
      Environment:
        Variables:
          SENDER_EMAIL: "terinchris2005@gmail.com"
          API_GATEWAY_DOMAIN: !Sub '${LeaveManagementApi}.execute-api.${AWS::Region}.amazonaws.com'
          LEAVE_REQUESTS_TABLE_NAME: !Ref LeaveRequestsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        External: !Split [" ", !Ref ExternalDependencies]
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/send-notification/app.ts

  # Lambda Permissions for API Gateway
  ApplyLeaveFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ApplyLeaveFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${LeaveManagementApi}/prod/POST/leaves"
    DependsOn: LeaveManagementApi

  ProcessApprovalFunctionApproveApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ProcessApprovalFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${LeaveManagementApi}/prod/GET/leaves/*/approve"
    DependsOn: LeaveManagementApi

  ProcessApprovalFunctionRejectApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ProcessApprovalFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${LeaveManagementApi}/prod/GET/leaves/*/reject"
    DependsOn: LeaveManagementApi

  CustomAuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CustomAuthorizerLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${LeaveManagementApi}/authorizers/*"
    DependsOn: LeaveManagementApi

  LeaveApprovalStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionSubstitutions:
        SendApprovalEmailLambdaArn: !GetAtt SendNotificationFunction.Arn
        SendUserApprovalNotificationLambdaArn: !GetAtt SendNotificationFunction.Arn
        SendUserRejectionNotificationLambdaArn: !GetAtt SendNotificationFunction.Arn
        APIGatewayUrl: !Sub "https://${LeaveManagementApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      DefinitionUri: statemachine/leave_approval_workflow.asl.json
      Role: !GetAtt StepFunctionsExecutionRole.Arn

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsLambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SendNotificationFunction.Arn
        - PolicyName: StepFunctionsDDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                Resource: !GetAtt LeaveRequestsTable.Arn
        - PolicyName: StepFunctionsTaskTokenPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                  - states:SendTaskHeartbeat
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"

Outputs:
  LeaveManagementApiUrl:
    Description: API Gateway endpoint URL for Leave Management API
    Value: !Sub "https://${LeaveManagementApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  LeaveApprovalStateMachineArn:
    Description: Leave Approval Step Functions State Machine ARN
    Value: !Ref LeaveApprovalStateMachine

  LeaveRequestsTableName:
    Description: DynamoDB Table Name for Leave Requests
    Value: !Ref LeaveRequestsTable
